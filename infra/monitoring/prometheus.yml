global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: aasan-api
    metrics_path: /api/metrics/
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs: [{ targets: ["api:8000"] }]
