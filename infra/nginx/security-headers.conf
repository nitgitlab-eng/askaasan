# Included in every location: nginx drops server-level add_header lines in any location that adds its own.
# script-src: Google Identity Services (sign-in button; also frame-src + connect-src); Razorpay Checkout; YouTube player API (video activities).
# No 'unsafe-eval' / 'wasm-unsafe-eval': Python code activities run self-hosted Pyodide in a sandboxed /pyodide/runner.html frame,
# which gets its own CSP (pyodide-headers.conf). Nothing else in the app needs eval or wasm.
# frame-src 'self': AI lesson widgets load from /api/learn/widgets/<id>/frame/ and the Python runner from /pyodide/runner.html
# (both sandboxed; each response sets its own CSP).
# img-src https: covers OpenStreetMap tiles (map activities) and YouTube thumbnails.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
