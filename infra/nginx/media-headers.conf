# Same headers Django's media views set (apps/media/api.py): immutable, never sniffed or run as a document.
types {
  image/webp webp;
  image/png png;
  image/jpeg jpg;
  video/mp4 mp4;
  video/webm webm;
  audio/mp4 m4a;
  audio/mpeg mp3;
  audio/wav wav;
  audio/ogg ogg;
}
default_type application/octet-stream;
add_header Cache-Control "public, max-age=31536000, immutable" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'" always;
