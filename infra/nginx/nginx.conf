# Main nginx config for the Aasan web image (replaces the image's /etc/nginx/nginx.conf). Site rules: default.conf.
user nginx;
worker_processes auto;
worker_rlimit_nofile 16384;  # each proxied WebSocket holds two file descriptors
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # One line per request with the request id Django also logs, and upstream timing.
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time rid=$req_id "$http_user_agent"';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;

  # Brute-force brakes on sign-in, sign-up and password reset, per client IP (Django throttles too). Generous on
  # purpose: a whole classroom can share one school IP. 429 when exceeded.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  # Health probes answer anonymous callers and the readiness one touches the DB and Redis: no free amplification.
  limit_req_zone $binary_remote_addr zone=health:1m rate=60r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  include /etc/nginx/conf.d/*.conf;
}
