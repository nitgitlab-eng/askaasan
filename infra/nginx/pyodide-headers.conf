# Python runner for code activities (web/public/pyodide/: runner.html + runner.js + the self-hosted Pyodide runtime).
# This is the only place on the site that allows eval: Pyodide needs 'unsafe-eval' + 'wasm-unsafe-eval'. The page is
# loaded as <iframe sandbox="allow-scripts">, and `sandbox allow-scripts` here keeps it in an opaque origin even if it
# is opened directly. Fetches from that opaque origin are cross-origin, so the (public) files are served with
# Access-Control-Allow-Origin: *. Keep PYODIDE_CSP in web/vite.config.ts in step (dev / preview).
add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
add_header Access-Control-Allow-Origin "*" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
