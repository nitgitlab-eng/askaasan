# PODMAN VARIANT of default.conf, used only with infra/docker-compose.podman.yml (cPanel server, Podman + CNI).
# Podman has no Docker DNS at 127.0.0.11, so the API and LiveKit are reached at the fixed addresses that
# docker-compose.podman.yml assigns. Everything else is identical to default.conf: keep the two files in step.
# Aasan web: serves the React build and proxies /api + /ws to Django (gunicorn + uvicorn workers).
# Put a TLS terminator (Caddy / cloud load balancer) in front; it must set X-Forwarded-Proto.
# Never expose this nginx's port 80 directly to the internet: X-Forwarded-Proto/-For would then be client-controlled.
# Set DJANGO_NUM_PROXIES to the number of proxies in front of Django (1 = this nginx only, 2 = LB + nginx).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
# Keep the caller's X-Request-ID (e.g. from a load balancer), else nginx's own; Django echoes it and logs it.
map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }


upstream api {
  zone api_upstream 64k;
  server 10.89.77.21:8000;  # api (fixed address, docker-compose.podman.yml)
  keepalive 64;  # idle connections kept open to the API workers
  keepalive_timeout 60s;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 12m;  # 10 MB document uploads + form overhead

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml
             image/svg+xml application/manifest+json application/wasm;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 300s;  # course generation and long AI answers
  }

  location /api/health/ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=health burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Prometheus scrapes api:8000 inside the Docker network (infra/docker-compose.monitoring.yml); never public.
  location = /api/metrics/ { return 404; }

  # Sign-in, sign-up and password reset: rate limited per client IP (zone `auth` in nginx.conf).
  location ~ ^/api/users/(login|register|password-reset/(request|verify-otp|confirm)|google)/$ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # AI lesson widgets (sandboxed iframe documents). Django sets this response's own strict CSP
  # (sandbox allow-scripts; default-src 'none'; frame-ancestors 'self'); the site CSP must NOT be added here or it would
  # intersect and block the widget's inline script. The other security headers still apply.
  location ~ ^/api/learn/widgets/\d+/frame/$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Lecture video uploads (Creator Lab) are allowed up to 50 MB.
  location ~ ^/api/studio/subsections/\d+/lectures/$ {
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 55m;
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;  # stream big uploads to the API instead of spooling them twice
    proxy_read_timeout 300s;
  }

  # "Connect Claude" (OAuth discovery for the MCP connector) lives at the site root.
  location ~ ^/\.well-known/oauth-(authorization-server|protected-resource) {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Lesson images and lecture media: public by unguessable name, served from the read-only mediafiles volume instead of
  # through Django. The patterns match apps/media/api.py (NAME, LECTURE) exactly, so nothing else in the volume is
  # reachable. nginx handles Range requests for seeking. Other /api/media/ paths (upload, generate, mine) go to Django.
  location ~ "^/api/media/(?<media_file>[0-9a-f]{32}\.(webp|png|jpg))$" {
    alias /srv/media/aasan/$media_file;
    include /etc/nginx/snippets/media-headers.conf;
  }
  location ~ "^/api/media/lectures/(?<lecture_uid>[0-9]+)/(?<lecture_file>[0-9a-f]{32}\.(mp4|webm|m4a|mp3|wav|ogg))$" {
    alias /srv/media/lectures/$lecture_uid/$lecture_file;
    include /etc/nginx/snippets/media-headers.conf;
  }
  # Shared speech clips (podcast, explainer, Listen), named by content hash (apps/providers/clips.py NAME).
  location ~ "^/api/media/speech/(?<speech_file>[0-9a-f]{64}\.(mp3|wav|ogg|m4a))$" {
    alias /srv/media/speech/$speech_file;
    include /etc/nginx/snippets/media-headers.conf;
  }

  # WebSockets (mentor, role-play, live class, workshops). Sockets idle up to an hour; the API pings every 20 s.
  location /ws/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $req_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Live voice signalling (LiveKit, `--profile voice`). Resolved per request, so nginx starts without it.
  location /livekit/ {
    set $livekit http://10.89.77.40:7880;  # livekit (fixed address)
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass $livekit;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Hashed build files never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # Python runner for code activities: its own CSP (the only eval on the site), CORS for the sandboxed frame.
  # The runtime sits in a versioned folder (/pyodide/v0.26.4/), so it is cached for good; the runner page is revalidated.
  location /pyodide/ {
    include /etc/nginx/snippets/pyodide-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location ~ ^/pyodide/v[0-9][^/]*/ {
    include /etc/nginx/snippets/pyodide-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # Always revalidated so new deploys reach everyone.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html (never cached).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
