<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aasan · offline</title>
<style>
  :root { color-scheme: light dark; --bg: #fff8f0; --ink: #1f1a17; --muted: #6b625c; --accent: #f97316; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17130f; --ink: #f6efe8; --muted: #b3a89e; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  img { width: 120px; height: 120px; }
  h1 { margin: 16px 0 4px; font-size: 1.6rem; }
  p { color: var(--muted); margin: 4px 0; }
  button { margin-top: 20px; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 10px 22px; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" />
    <h1>You're offline</h1>
    <p>Kili needs the internet to think. Check your connection and try again.</p>
    <p lang="ta">இணைய இணைப்பு இல்லை. இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.</p>
    <button onclick="location.reload()">Try again · மீண்டும் முயல்</button>
  </main>
</body>
</html>
