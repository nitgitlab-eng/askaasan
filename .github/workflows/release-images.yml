# Release images: build the API and web images once, in CI, and push them to GHCR. Staging and production then pull
# the same images by tag (docs/DEPLOY.md, "Staging and release runbook"); nothing is built on the servers.
#   ghcr.io/<owner>/aasan-api:<tag>  and  :sha-<short sha>
#   ghcr.io/<owner>/aasan-web:<tag>  and  :sha-<short sha>
# Same Dockerfiles and build contexts as infra/docker-compose.yml. Each image carries SLSA provenance and an SBOM
# attestation (BuildKit), so `docker buildx imagetools inspect` shows what went into it.
name: Release images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. v1.3.0-rc1). Empty: the git tag when run on a tag, otherwise only sha-<short>."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write  # push to GHCR; provenance and SBOM attestations are stored next to the image
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: aasan-api
            context: api
            dockerfile: infra/api.Dockerfile
          - name: aasan-web
            context: .
            dockerfile: infra/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # GHCR names must be lowercase.
          repo="ghcr.io/${OWNER,,}/${IMAGE}"
          tags="${repo}:sha-${GITHUB_SHA::7}"
          release=""
          if [ -n "$INPUT_TAG" ]; then release="$INPUT_TAG"; elif [ "$REF_TYPE" = "tag" ]; then release="$REF_NAME"; fi
          if [ -n "$release" ]; then
            if ! printf '%s' "$release" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "::error::'$release' is not a valid image tag"; exit 1
            fi
            tags="${repo}:${release},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
